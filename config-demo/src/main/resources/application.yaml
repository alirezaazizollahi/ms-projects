spring:
  application:
    name: configdemo
  config:
    import: optional:configserver:http://localhost:8888

  profiles:
    active: dev


build:
  id: ${ID}
  version: ${VERSION}
  name: ${NAME}


management:
  endpoints:
    web:
      exposure:
        include: "refresh,busrefresh"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true